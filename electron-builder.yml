appId: com.raawaa.kewutong
productName: kewutong
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!**/*.map"
extraResources:
  - from: "./src/main/migrations"
    to: "migrations"
  - from: "./holidays"
    to: "holidays"
mac:
  identity: "-"
  notarize: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: public.app-category.productivity
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - target: deb
      arch:
        - x64
    - target: AppImage
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
  desktop:
    entry: "Name=kewutong\nComment=科室任务管理\nExec=/opt/kewutong/kewutong\nIcon=kewutong\nType=Application\nTerminal=false\nCategories=Office;\n"
npmRebuild: true