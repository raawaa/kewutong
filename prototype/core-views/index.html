<!DOCTYPE html>
<!--
  一次性原型 —— 用完即弃，不要合进 master。
  问题：核心三视图（今日/本周、人员矩阵、项目看板）应该长什么样？
  铺法：顶部 tab 切三个视图；「今日/本周」出 3 个结构上截然不同的变体，
        通过 ?variant=A|B|C 与底部悬浮条切换。另两个视图各 1 稿。
  参见 issue #4（map #2）。全部数据为写死的示例数据，无功能、无持久化。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>科务通 · 核心三视图原型（示例数据）</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #09090b;
    --muted: #f4f4f5;
    --muted-fg: #71717a;
    --border: #e4e4e7;
    --card: #ffffff;
    --accent: #f4f4f5;
    --primary: #18181b;
    --primary-fg: #fafafa;
    --radius: 8px;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / .05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / .07), 0 2px 4px -2px rgb(0 0 0 / .05);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- 示例数据横幅 ---------- */
  .sample-banner {
    background: #fefce8; border-bottom: 1px solid #fde68a; color: #854d0e;
    font-size: 12px; padding: 6px 20px; display: flex; align-items: center; gap: 8px;
  }
  .sample-banner strong { font-weight: 600; }
  .sample-banner .spacer { flex: 1; }
  .sample-banner button {
    font: inherit; font-size: 11px; border: 1px solid #fcd34d; background: #fffbeb;
    color: #854d0e; border-radius: 6px; padding: 2px 8px; cursor: pointer;
  }

  /* ---------- 顶栏 + tabs ---------- */
  .appbar {
    height: 52px; border-bottom: 1px solid var(--border); display: flex;
    align-items: center; gap: 20px; padding: 0 20px; background: var(--bg);
    position: sticky; top: 0; z-index: 30;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
  .brand .logo {
    width: 24px; height: 24px; border-radius: 6px; background: var(--primary);
    color: var(--primary-fg); display: grid; place-items: center; font-size: 12px;
  }
  .tabs { display: flex; gap: 2px; background: var(--muted); padding: 3px; border-radius: var(--radius); }
  .tabs button {
    font: inherit; font-size: 13px; font-weight: 500; border: 0; background: transparent;
    color: var(--muted-fg); padding: 5px 14px; border-radius: 6px; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--bg); color: var(--fg); box-shadow: var(--shadow-sm); }
  .appbar .spacer { flex: 1; }
  .kbd {
    font-size: 11px; color: var(--muted-fg); border: 1px solid var(--border);
    border-bottom-width: 2px; border-radius: 5px; padding: 2px 6px; background: var(--muted);
  }

  /* ---------- 通用积木 ---------- */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
  .section-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .section-title .count {
    font-size: 11px; font-weight: 500; color: var(--muted-fg);
    background: var(--muted); border-radius: 999px; padding: 1px 7px;
  }
  .muted { color: var(--muted-fg); }
  .avatar {
    width: 26px; height: 26px; border-radius: 999px; flex: 0 0 auto;
    display: grid; place-items: center; font-size: 11px; font-weight: 600; color: #fff;
  }
  .avatar.sm { width: 20px; height: 20px; font-size: 10px; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500;
    padding: 1px 7px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent;
  }
  .badge.open      { background: #f4f4f5; color: #52525b; border-color: #e4e4e7; }
  .badge.inprogress{ background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
  .badge.blocked   { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
  .badge.waiting   { background: #fffbeb; color: #b45309; border-color: #fde68a; }
  .badge.done      { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }
  .badge.cancelled { background: #fafafa; color: #a1a1aa; border-color: #e4e4e7; text-decoration: line-through; }
  .badge.recur     { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
  .due { font-size: 12px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
  .due.overdue { color: #b91c1c; font-weight: 500; }
  .due.today { color: #b45309; font-weight: 500; }
  .proj-chip {
    font-size: 11px; color: var(--muted-fg); background: var(--muted);
    padding: 1px 7px; border-radius: 5px; white-space: nowrap;
  }

  /* 列表行 */
  .row {
    display: flex; align-items: center; gap: 10px; padding: 9px 14px;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: #fafafa; }
  .row .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.is-cancelled .title { text-decoration: line-through; color: var(--muted-fg); }

  /* 任务卡 */
  .tcard {
    border: 1px solid var(--border); border-radius: 7px; background: var(--card);
    padding: 9px 11px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow-sm);
  }
  .tcard:hover { box-shadow: var(--shadow-md); }
  .tcard .t { font-size: 13px; font-weight: 500; line-height: 1.35; }
  .tcard .meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tcard.blocked-edge { border-left: 3px solid #ef4444; }
  .tcard.waiting-edge { border-left: 3px solid #f59e0b; }

  /* 统计条 / 瓦片 */
  .statstrip { display: flex; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .statstrip .s { flex: 1; padding: 12px 16px; border-right: 1px solid var(--border); }
  .statstrip .s:last-child { border-right: 0; }
  .statstrip .n { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .statstrip .l { font-size: 12px; color: var(--muted-fg); }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile { padding: 16px 18px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); }
  .tile .n { font-size: 30px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tile .l { font-size: 12px; color: var(--muted-fg); margin-top: 2px; }
  .tile .sub { font-size: 11px; color: var(--muted-fg); margin-top: 6px; }
  .tile.warn { background: #fef2f2; border-color: #fecaca; }
  .tile.warn .n, .tile.warn .l { color: #b91c1c; }

  /* 页面容器 */
  .page { padding: 20px; }
  .page.wide { padding: 20px 20px 92px; }

  /* ---------- 底部悬浮变体条 ---------- */
  #switcher {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 50;
    display: flex; align-items: center; gap: 2px; background: #18181b; color: #fafafa;
    border-radius: 999px; padding: 5px 6px; box-shadow: var(--shadow-lg);
    font-size: 12px;
  }
  #switcher button {
    font: inherit; border: 0; background: transparent; color: #a1a1aa; cursor: pointer;
    width: 26px; height: 26px; border-radius: 999px; display: grid; place-items: center; font-size: 14px;
  }
  #switcher button:hover { background: #27272a; color: #fafafa; }
  #switcher .label { padding: 0 10px; font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #switcher .hint { color: #52525b; padding-right: 8px; font-size: 11px; }
  #switcher[hidden] { display: none; }

  /* ---------- 变体 B：双栏 ---------- */
  .split { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 20px; align-items: start; }
  .side-sticky { position: sticky; top: 72px; }

  /* ---------- 变体 C：时间轴纵列 ---------- */
  .timecols { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
  .timecol { background: var(--muted); border-radius: var(--radius); padding: 10px; min-height: 320px; }
  .timecol > header { display: flex; align-items: baseline; gap: 7px; padding: 2px 4px 10px; }
  .timecol > header .h { font-size: 13px; font-weight: 600; }
  .timecol > header .d { font-size: 11px; color: var(--muted-fg); }
  .timecol .stack { display: flex; flex-direction: column; gap: 8px; }
  .timecol.danger { background: #fef2f2; }

  /* ---------- 人员矩阵 ---------- */
  .matrix { display: grid; grid-template-columns: 210px minmax(0,1fr); gap: 0; height: calc(100vh - 52px - 29px); }
  .matrix .tree { border-right: 1px solid var(--border); padding: 14px 12px; overflow-y: auto; }
  .matrix .tree .grp { margin-bottom: 6px; }
  .matrix .tree .grp > .gh {
    display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 6px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .matrix .tree .grp > .gh:hover { background: var(--muted); }
  .matrix .tree .grp > .gh .n { margin-left: auto; font-size: 11px; font-weight: 500; color: var(--muted-fg); }
  .matrix .tree .person {
    display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 22px;
    border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  .matrix .tree .person:hover { background: var(--muted); }
  .matrix .tree .person .n { margin-left: auto; font-size: 11px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
  .matrix .tree .person .dot { width: 6px; height: 6px; border-radius: 999px; background: #ef4444; }
  .matrix .cols { overflow: auto; padding: 14px; display: flex; gap: 12px; align-items: flex-start; }
  .pcol { width: 240px; flex: 0 0 auto; background: var(--muted); border-radius: var(--radius); padding: 10px; }
  .pcol.collapsed { width: 52px; padding: 10px 8px; }
  .pcol > header { display: flex; align-items: center; gap: 8px; padding-bottom: 10px; cursor: pointer; }
  .pcol > header .name { font-size: 13px; font-weight: 600; }
  .pcol > header .n { margin-left: auto; font-size: 11px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
  .pcol > header .chev { color: var(--muted-fg); font-size: 11px; }
  .pcol.collapsed > header { flex-direction: column; padding-bottom: 0; gap: 6px; }
  .pcol.collapsed .stack { display: none; }
  .pcol .stack { display: flex; flex-direction: column; gap: 8px; }
  .pcol .empty { font-size: 12px; color: var(--muted-fg); padding: 8px 2px; }
  .grp-divider {
    flex: 0 0 auto; width: 1px; align-self: stretch; background: var(--border); margin: 0 4px;
    position: relative;
  }
  .grp-label {
    flex: 0 0 auto; writing-mode: vertical-rl; font-size: 11px; font-weight: 600;
    color: var(--muted-fg); letter-spacing: 0.08em; padding: 6px 2px; align-self: stretch;
  }

  /* ---------- 项目看板 ---------- */
  .projgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .projcard { padding: 14px; cursor: pointer; transition: box-shadow .12s, border-color .12s; }
  .projcard:hover { box-shadow: var(--shadow-md); }
  .projcard[aria-selected="true"] { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
  .projcard .ph { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
  .projcard .ph .t { font-size: 14px; font-weight: 600; flex: 1; line-height: 1.3; }
  .bar { height: 6px; background: var(--muted); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
  .bar.risky > i { background: #ef4444; }
  .projcard .pf { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: 12px; color: var(--muted-fg); }
  .statuscols { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 10px; }
  .scol { background: var(--muted); border-radius: var(--radius); padding: 9px; min-height: 200px; }
  .scol > header { display: flex; align-items: center; gap: 6px; padding: 1px 3px 9px; }
  .scol > header .n { margin-left: auto; font-size: 11px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
  .scol .stack { display: flex; flex-direction: column; gap: 7px; }
  .scol .empty { font-size: 11px; color: #a1a1aa; padding: 6px 3px; }
</style>
</head>
<body>

<div class="sample-banner">
  <strong>示例数据</strong>
  <span>本页所有人员、项目、任务均为演示用假数据，仅用于走查布局，无任何真实内容。</span>
  <span class="spacer"></span>
  <button type="button" onclick="alert('（原型占位）真实应用里这里会一键清空全部示例数据。')">一键清空示例数据</button>
</div>

<div class="appbar">
  <div class="brand"><span class="logo">科</span> 科务通</div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="spacer"></div>
  <span class="kbd">⌘K</span>
  <span class="muted" style="font-size:12px">命令面板</span>
</div>

<main id="root"></main>

<div id="switcher" hidden>
  <button type="button" id="prevVariant" title="上一个变体">‹</button>
  <span class="label" id="variantLabel"></span>
  <button type="button" id="nextVariant" title="下一个变体">›</button>
  <span class="hint">← → 切换</span>
</div>

   工具
   ===================================================================== */
const STATUS_LABEL = { open:'待办', inprogress:'进行中', blocked:'阻塞', waiting:'等待中', done:'已完成', cancelled:'已取消' };
const STATUS_ORDER = ['open','inprogress','blocked','waiting','done','cancelled'];
const AVATAR_COLORS = ['#0f766e','#b45309','#1d4ed8','#7c3aed','#be123c','#15803d','#0369a1','#a16207','#9333ea','#c2410c'];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash = s => [...s].reduce((a,c) => a + c.charCodeAt(0), 0);
const projName = id => (PROJECTS.find(p => p.id === id) || {}).name || '';
const groupOf = who => (GROUPS.find(g => g.people.includes(who)) || {}).name || '';
const mmdd = d => d.slice(5).replace('-','/');
const isOverdue = t => t.due < TODAY && t.status !== 'done' && t.status !== 'cancelled';
const isOpenish = t => t.status !== 'done' && t.status !== 'cancelled';

function avatar(name, sm) {
  const c = AVATAR_COLORS[hash(name) % AVATAR_COLORS.length];
  return `<span class="avatar${sm ? ' sm' : ''}" style="background:${c}" title="${esc(name)}">${esc(name.slice(-1))}</span>`;
}
function badge(status) {
  return `<span class="badge ${status}">${STATUS_LABEL[status]}</span>`;
}
function dueLabel(d) {
  if (d < TODAY) return `<span class="due overdue">逾期 ${mmdd(d)}</span>`;
  if (d === TODAY) return `<span class="due today">今天</span>`;
  return `<span class="due">${mmdd(d)}${WDAY[d] ? ' ' + WDAY[d] : ''}</span>`;
}

// 列表行（变体 A / 变体 B 主栏）
function taskRow(t, opts = {}) {
  return `<div class="row ${t.status === 'cancelled' ? 'is-cancelled' : ''}">
    ${avatar(t.who)}
    <span class="title">${esc(t.title)}${t.note ? ` <span class="muted" style="font-size:12px">· ${esc(t.note)}</span>` : ''}</span>
    ${t.proj ? `<span class="proj-chip">${esc(projName(t.proj))}</span>` : ''}
    ${badge(t.status)}
    ${opts.hideDue ? '' : dueLabel(t.due)}
  </div>`;
}

// 紧凑卡（变体 C / 人员矩阵 / 项目看板）
function taskCard(t, opts = {}) {
  const edge = t.status === 'blocked' ? ' blocked-edge' : t.status === 'waiting' ? ' waiting-edge' : '';
  return `<div class="tcard${edge}">
    <div class="t" ${t.status === 'cancelled' ? 'style="text-decoration:line-through;color:var(--muted-fg)"' : ''}>${esc(t.title)}</div>
    <div class="meta">
      ${opts.hideWho ? '' : avatar(t.who, true)}
      ${badge(t.status)}
      ${opts.hideProj || !t.proj ? '' : `<span class="proj-chip">${esc(projName(t.proj))}</span>`}
      ${opts.hideDue ? '' : dueLabel(t.due)}
    </div>
    ${t.note ? `<div class="muted" style="font-size:11px">${esc(t.note)}</div>` : ''}
  </div>`;
}

function instanceRow(i) {
  return `<div class="row">
    <span class="due" style="width:42px">${i.time}</span>
    ${avatar(i.who)}
    <span class="title">${esc(i.title)}</span>
    <span class="badge recur">↻ ${esc(i.tmpl)}</span>
    ${badge(i.status)}
  </div>`;
}
function instanceCard(i) {
  return `<div class="tcard">
    <div class="t">${esc(i.title)}</div>
    <div class="meta">
      <span class="due">${i.time}</span>${avatar(i.who, true)}${badge(i.status)}
      <span class="badge recur">↻</span>
    </div>
  </div>`;
}

/* 派生数据 */
const overdue   = TASKS.filter(isOverdue).sort((a,b) => a.due.localeCompare(b.due));
const dueToday  = TASKS.filter(t => t.due === TODAY && isOpenish(t));
const dueTmr    = TASKS.filter(t => t.due === '2026-09-11' && isOpenish(t));
const restWeek  = TASKS.filter(t => t.due > '2026-09-11' && t.due <= '2026-09-13' && isOpenish(t))
                       .sort((a,b) => a.due.localeCompare(b.due));
const weekAhead = TASKS.filter(t => t.due > TODAY && t.due <= '2026-09-13' && isOpenish(t))
                       .sort((a,b) => a.due.localeCompare(b.due));
const STATS = {
  onDuty:   GROUPS.reduce((n,g) => n + g.people.length, 0) - OFF_DUTY.length,
  headcount:GROUPS.reduce((n,g) => n + g.people.length, 0),
  progress: TASKS.filter(t => t.status === 'inprogress').length,
  blocked:  TASKS.filter(t => t.status === 'blocked').length,
  waiting:  TASKS.filter(t => t.status === 'waiting').length,
  today:    dueToday.length,
  overdue:  overdue.length,
};

/* =====================================================================
   视图：今日 / 本周 —— 变体 A：摘要条 + 三段纵向列表流
   ===================================================================== */
function renderTodayA() {
  const sec = (title, n, inner, extra = '') => `
    <section style="margin-top:20px">
      <div class="section-title" style="margin-bottom:8px">${title}<span class="count">${n}</span>${extra}</div>
      <div class="card">${inner || '<div class="row muted">暂无</div>'}</div>
    </section>`;
  return `<div class="page wide" style="max-width:1080px;margin:0 auto">
    <h1 style="font-size:20px">今天 · 9月10日 周四</h1>
    <p class="muted" style="margin:4px 0 16px;font-size:13px">本周 9/7 – 9/13</p>

    <div class="statstrip">
      <div class="s"><div class="n">${STATS.onDuty} <span class="muted" style="font-size:13px;font-weight:400">/ ${STATS.headcount}</span></div><div class="l">在岗人数</div></div>
      <div class="s"><div class="n">${STATS.progress}</div><div class="l">进行中</div></div>
      <div class="s"><div class="n" style="color:#b91c1c">${STATS.blocked}</div><div class="l">阻塞</div></div>
      <div class="s"><div class="n" style="color:#b45309">${STATS.waiting}</div><div class="l">等待中</div></div>
      <div class="s"><div class="n">${STATS.today}</div><div class="l">今日到期</div></div>
    </div>

    ${overdue.length ? sec('⚠️ 已逾期', overdue.length, overdue.map(t => taskRow(t)).join('')) : ''}
    ${sec('今日到期', dueToday.length, dueToday.map(t => taskRow(t)).join(''))}
    ${sec('今日周期性事务', INSTANCES.length, INSTANCES.map(instanceRow).join(''))}
    ${sec('本周到期（今日之后）', weekAhead.length, weekAhead.map(t => taskRow(t)).join(''))}
  </div>`;
}

/* =====================================================================
   视图：今日 / 本周 —— 变体 B：左「今日」主栏 + 右「本周展望」侧栏
   ===================================================================== */
function renderTodayB() {
  const byDay = {};
  weekAhead.forEach(t => (byDay[t.due] = byDay[t.due] || []).push(t));
  const sideDays = Object.keys(byDay).sort().map(d => `
    <div style="padding:9px 12px;border-bottom:1px solid var(--border)">
      <div style="font-size:12px;font-weight:600;margin-bottom:5px">${WDAY[d]} <span class="muted" style="font-weight:400">${mmdd(d)}</span></div>
      ${byDay[d].map(t => `<div style="display:flex;align-items:center;gap:6px;padding:2px 0">
          ${avatar(t.who, true)}
          <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px">${esc(t.title)}</span>
          <span class="badge ${t.status}">${STATUS_LABEL[t.status]}</span>
        </div>`).join('')}
    </div>`).join('');

  return `<div class="page wide">
    <div class="split" style="max-width:1320px;margin:0 auto">
      <div>
        <h1 style="font-size:22px">今天 · 9月10日 周四</h1>
        <p class="muted" style="margin:4px 0 16px;font-size:13px">${STATS.onDuty}/${STATS.headcount} 人在岗 · ${STATS.progress} 条进行中 · ${STATS.blocked} 条阻塞</p>

        ${overdue.length ? `
        <div class="card" style="margin-bottom:16px;border-color:#fecaca">
          <div style="padding:10px 14px;border-bottom:1px solid #fecaca;background:#fef2f2;border-radius:7px 7px 0 0">
            <div class="section-title" style="color:#b91c1c">已逾期<span class="count" style="background:#fee2e2;color:#b91c1c">${overdue.length}</span></div>
          </div>
          ${overdue.map(t => taskRow(t)).join('')}
        </div>` : ''}

        <div class="section-title" style="margin-bottom:8px">今日到期<span class="count">${dueToday.length}</span></div>
        <div class="card" style="margin-bottom:20px">${dueToday.map(t => taskRow(t, {hideDue:true})).join('')}</div>

        <div class="section-title" style="margin-bottom:8px">今日周期性事务<span class="count">${INSTANCES.length}</span></div>
        <div class="card">${INSTANCES.map(instanceRow).join('')}</div>
      </div>

      <aside class="side-sticky">
        <div class="card" style="padding:14px;margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted" style="font-size:12px">在岗</span><b>${STATS.onDuty} / ${STATS.headcount}</b></div>
          <div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted" style="font-size:12px">进行中</span><b>${STATS.progress}</b></div>
          <div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted" style="font-size:12px">阻塞</span><b style="color:#b91c1c">${STATS.blocked}</b></div>
          <div style="display:flex;justify-content:space-between;padding:3px 0"><span class="muted" style="font-size:12px">等待中</span><b style="color:#b45309">${STATS.waiting}</b></div>
          <div style="border-top:1px solid var(--border);margin:8px 0 6px"></div>
          <div class="muted" style="font-size:11px">请假 / 外出：${OFF_DUTY.join('、')}</div>
        </div>
        <div class="card">
          <div style="padding:10px 12px;border-bottom:1px solid var(--border)">
            <div class="section-title">本周展望<span class="count">${weekAhead.length}</span></div>
          </div>
          ${sideDays || '<div style="padding:12px" class="muted">本周剩余无到期</div>'}
        </div>
      </aside>
    </div>
  </div>`;
}

/* =====================================================================
   视图：今日 / 本周 —— 变体 C：顶部计数瓦片 + 时间轴纵列
   ===================================================================== */
function renderTodayC() {
  const col = (h, d, items, danger) => `
    <div class="timecol${danger ? ' danger' : ''}">
      <header><span class="h">${h}</span><span class="d">${d}</span><span class="d" style="margin-left:auto">${items.length}</span></header>
      <div class="stack">${items.length ? items.join('') : '<div class="muted" style="font-size:12px;padding:4px 2px">—</div>'}</div>
    </div>`;

  return `<div class="page wide">
    <h1 style="font-size:20px;margin-bottom:14px">今天 · 9月10日 周四</h1>

    <div class="tiles" style="margin-bottom:18px">
      <div class="tile">
        <div class="n">${STATS.onDuty}<span class="muted" style="font-size:16px;font-weight:400"> / ${STATS.headcount}</span></div>
        <div class="l">在岗人数</div>
        <div class="sub">请假 / 外出：${OFF_DUTY.join('、')}</div>
      </div>
      <div class="tile">
        <div class="n">${STATS.progress}</div><div class="l">进行中</div>
        <div class="sub">覆盖 ${PROJECTS.length} 个项目</div>
      </div>
      <div class="tile warn">
        <div class="n">${STATS.blocked}</div><div class="l">阻塞</div>
        <div class="sub">最长已阻塞 4 天</div>
      </div>
      <div class="tile">
        <div class="n">${INSTANCES.length}</div><div class="l">今日周期性事务</div>
        <div class="sub">${INSTANCES.filter(i => i.status === 'done').length} 项已完成</div>
      </div>
    </div>

    <div class="timecols">
      ${col('已逾期','', overdue.map(t => taskCard(t)), true)}
      ${col('今天','9/10 周四', [
          ...INSTANCES.map(instanceCard),
          ...dueToday.map(t => taskCard(t)),
        ])}
      ${col('明天','9/11 周五', dueTmr.map(t => taskCard(t)))}
      ${col('本周剩余','9/12 – 9/13', restWeek.map(t => taskCard(t)))}
    </div>
  </div>`;
}

/* =====================================================================
   视图：人员矩阵 —— 左侧分组树 + 每人一列的在手任务卡片堆
   ===================================================================== */
const collapsed = new Set();
function renderPeople() {
  const tree = GROUPS.map(g => `
    <div class="grp">
      <div class="gh">▾ ${esc(g.name)}<span class="n">${g.people.length} 人</span></div>
      ${g.people.map(p => {
        const mine = TASKS.filter(t => t.who === p && isOpenish(t));
        const blk = mine.filter(t => t.status === 'blocked').length;
        return `<div class="person">${avatar(p, true)}<span style="${OFF_DUTY.includes(p) ? 'color:var(--muted-fg)' : ''}">${esc(p)}${OFF_DUTY.includes(p) ? ' <span style="font-size:10px">(请假)</span>' : ''}</span>
          ${blk ? '<span class="dot" title="有阻塞"></span>' : ''}<span class="n">${mine.length}</span></div>`;
      }).join('')}
    </div>`).join('');

  const cols = GROUPS.map(g => {
    const inner = g.people.map(p => {
      const mine = TASKS.filter(t => t.who === p && isOpenish(t))
                        .sort((a,b) => STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status) || a.due.localeCompare(b.due));
      const isCol = collapsed.has(p);
      return `<div class="pcol${isCol ? ' collapsed' : ''}">
        <header onclick="toggleCol('${p}')">
          ${avatar(p)}
          ${isCol ? `<span class="n">${mine.length}</span>` : `<span class="name">${esc(p)}</span><span class="n">${mine.length}</span><span class="chev">▾</span>`}
        </header>
        <div class="stack">${mine.length ? mine.map(t => taskCard(t, {hideWho:true})).join('') : '<div class="empty">手上没有在办任务</div>'}</div>
      </div>`;
    }).join('');
    return `<div class="grp-label">${esc(g.name)}</div>${inner}<div class="grp-divider"></div>`;
  }).join('');

  return `<div class="matrix">
    <div class="tree">
      <div class="muted" style="font-size:11px;font-weight:600;letter-spacing:.06em;padding:0 8px 8px">子组 / 人员</div>
      ${tree}
    </div>
    <div class="cols">${cols}</div>
  </div>`;
}
function toggleCol(p) { collapsed.has(p) ? collapsed.delete(p) : collapsed.add(p); render(); }

/* =====================================================================
   视图：项目看板 —— 项目卡网格 + 选中项目的任务按状态分列
   ===================================================================== */
let selectedProj = 'p1';
function renderProjects() {
  const cards = PROJECTS.map(p => {
    const mine = TASKS.filter(t => t.proj === p.id);
    const done = mine.filter(t => t.status === 'done').length;
    const blk  = mine.filter(t => t.status === 'blocked').length;
    const pct  = mine.length ? Math.round(done / mine.length * 100) : 0;
    return `<div class="card projcard" aria-selected="${p.id === selectedProj}" onclick="selectProj('${p.id}')">
      <div class="ph">
        <div class="t">${esc(p.name)}</div>
        ${blk ? `<span class="badge blocked">${blk} 阻塞</span>` : ''}
      </div>
      <div class="bar${blk >= 3 ? ' risky' : ''}"><i style="width:${pct}%"></i></div>
      <div class="pf">
        ${avatar(p.owner, true)} <span>${esc(p.owner)}</span>
        <span style="margin-left:auto;font-variant-numeric:tabular-nums">${done}/${mine.length} · ${pct}%</span>
      </div>
      <div class="pf" style="margin-top:4px"><span>截止 ${p.due.slice(0,4) === '2026' ? mmdd(p.due) : p.due}</span></div>
    </div>`;
  }).join('');

  const sel = PROJECTS.find(p => p.id === selectedProj);
  const mine = TASKS.filter(t => t.proj === selectedProj);
  const cols = STATUS_ORDER.map(s => {
    const items = mine.filter(t => t.status === s);
    return `<div class="scol">
      <header>${badge(s)}<span class="n">${items.length}</span></header>
      <div class="stack">${items.length ? items.map(t => taskCard(t, {hideProj:true})).join('') : '<div class="empty">—</div>'}</div>
    </div>`;
  }).join('');

  return `<div class="page wide">
    <h1 style="font-size:20px;margin-bottom:12px">项目看板 <span class="muted" style="font-size:13px;font-weight:400">${PROJECTS.length} 个在办项目</span></h1>
    <div class="projgrid" style="margin-bottom:24px">${cards}</div>
    <div class="section-title" style="margin-bottom:10px">
      ${esc(sel.name)} · 任务分布<span class="count">${mine.length}</span>
      <span class="muted" style="font-weight:400;font-size:12px">点上方项目卡切换</span>
    </div>
    <div class="statuscols">${cols}</div>
  </div>`;
}
function selectProj(id) { selectedProj = id; render(); }

/* =====================================================================
   路由：?view= 与 ?variant=
   ===================================================================== */
const VIEWS = [
  { key:'today',    label:'今日 / 本周' },
  { key:'people',   label:'人员矩阵' },
  { key:'projects', label:'项目看板' },
];
const VARIANTS = [
  { key:'A', name:'摘要条 + 列表流',   render: renderTodayA },
  { key:'B', name:'今日主栏 + 本周侧栏', render: renderTodayB },
  { key:'C', name:'计数瓦片 + 时间轴纵列', render: renderTodayC },
];

const params = new URLSearchParams(location.search);
let view    = VIEWS.some(v => v.key === params.get('view')) ? params.get('view') : 'today';
let variant = VARIANTS.some(v => v.key === params.get('variant')) ? params.get('variant') : 'A';

function syncUrl() {
  const p = new URLSearchParams();
  p.set('view', view);
  if (view === 'today') p.set('variant', variant);
  history.replaceState(null, '', location.pathname + '?' + p);
}

function render() {
  document.getElementById('tabs').innerHTML = VIEWS.map(v =>
    `<button role="tab" aria-selected="${v.key === view}" onclick="setView('${v.key}')">${v.label}</button>`).join('');

  const root = document.getElementById('root');
  if (view === 'today')         root.innerHTML = VARIANTS.find(v => v.key === variant).render();
  else if (view === 'people')   root.innerHTML = renderPeople();
  else                          root.innerHTML = renderProjects();

  const sw = document.getElementById('switcher');
  sw.hidden = view !== 'today';
  if (view === 'today') {
    const v = VARIANTS.find(x => x.key === variant);
    document.getElementById('variantLabel').textContent = `${v.key} · ${v.name}`;
  }
  syncUrl();
}
function setView(k) { view = k; window.scrollTo(0,0); render(); }
function cycle(step) {
  if (view !== 'today') return;
  const i = VARIANTS.findIndex(v => v.key === variant);
  variant = VARIANTS[(i + step + VARIANTS.length) % VARIANTS.length].key;
  window.scrollTo(0,0);
  render();
}

document.getElementById('prevVariant').onclick = () => cycle(-1);
document.getElementById('nextVariant').onclick = () => cycle(1);
document.addEventListener('keydown', e => {
  const el = document.activeElement;
  if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;
  if (e.key === 'ArrowLeft')  cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});

render();
</script>
</body>
