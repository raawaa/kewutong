[package]
name = "kewutong"
version = "0.1.0"
description = "科室任务管理"
authors = ["raawaa"]
edition = "2021"

[lib]
# `_lib` 后缀是 Tauri 模板惯例：避免 Windows 上 lib 名与 bin 名冲突
# https://github.com/rust-lang/cargo/issues/8519
name = "kewutong_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rusqlite 钉在 0.39 而不是 spec #15 写的 0.40：refinery 0.9.2 的 rusqlite 依赖上限是
# `>=0.23, <=0.39`（见 refinery_core/Cargo.toml），跨过这条线会解析出两份 rusqlite，
# `runner().run(&mut conn)` 直接编译不过。上游 PR rust-db/refinery#445 合并后再升。
rusqlite = { version = "0.39", features = ["bundled", "serde_json"] }
refinery = { version = "0.9", default-features = false, features = ["rusqlite"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
# xtask 抓取脚本同步拉取 holiday-cn / date.nager.at 用——同步阻塞 API
# 足够,一年一次,不引 async runtime
#
# `tls` 是必须的:主备源都是 HTTPS,无 TLS 后端时 ureq 直接报
# "Unknown Scheme: cannot make HTTPS request because no TLS backend is configured"
# ——把 `default-features` 关掉又忘了显式开就是踩这个坑。`gzip` 跟着 default
# 一起要,响应压缩省一点带宽。
ureq = { version = "2", features = ["json"] }

[[bin]]
name = "kewutong"
path = "src/main.rs"

[[bin]]
name = "xtask"
path = "src/bin/xtask.rs"

# single-instance 只在桌面端存在
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4"

[dev-dependencies]
# `test` feature 打开 tauri::test（mock_builder / get_ipc_response），只在测试构建里生效
tauri = { version = "2.11", features = ["test"] }
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
